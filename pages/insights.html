<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Insights — NovaCart AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .insight-card { background: var(--surface-100); border: 1px solid var(--surface-border); border-radius: var(--radius-xl); padding: 24px; margin-bottom: 16px; transition: all 0.2s; }
    .insight-card:hover { border-color: var(--surface-border-hover); box-shadow: var(--shadow-md); }
    .insight-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .insight-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .insight-section-box { background: var(--surface-200); border-radius: var(--radius-md); padding: 12px 16px; margin: 10px 0; font-size: 0.82rem; }
    .insight-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; }
  </style>
</head>
<body class="admin-layout">

  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content" id="main-content">
    <div class="topbar" id="topbar"></div>
    <div class="page-content">

      <div class="page-header">
        <div class="page-header-inner">
          <div>
            <div class="page-title">💡 AI Insights &amp; Findings Hub</div>
            <div class="page-subtitle">Cross-module operational insights generated by NovaCart AI pattern recognition engines.</div>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn-primary btn-md" onclick="generateNewInsight()">🧠 Run Pattern Detection</button>
          </div>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap">
        <button class="tab-btn active" onclick="filterCategory('ALL', this)">All Insights</button>
        <button class="tab-btn" onclick="filterCategory('PHANTOM_STOCK', this)">👻 Phantom Stock</button>
        <button class="tab-btn" onclick="filterCategory('DELIVERY', this)">⏱ Honest ETA &amp; Delivery</button>
        <button class="tab-btn" onclick="filterCategory('REORDER', this)">🔄 Smart Reorder</button>
      </div>

      <!-- INSIGHT CARDS LIST -->
      <div id="insights-list">
        <!-- JS Populated -->
      </div>

    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/ai-engine.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    let currentCategory = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      NOVA_SHELL.init('AI Insights', 'Explainable root cause analysis & systemic operational insights');
      renderInsights();
    });

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderInsights();
    }

    function renderInsights() {
      const container = document.getElementById('insights-list');
      let insights = window.NOVACART_DATA.insights;

      if (currentCategory !== 'ALL') {
        insights = insights.filter(i => i.category === currentCategory);
      }

      container.innerHTML = insights.map(i => `
        <div class="insight-card">
          <div class="insight-header">
            <div class="insight-title">
              <span style="font-size:1.5rem">${i.icon}</span>
              <span>${i.title}</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <span class="badge ${i.severity === 'CRITICAL' ? 'badge-red' : i.severity === 'HIGH' ? 'badge-orange' : 'badge-green'}">
                ${i.severity}
              </span>
              <span class="badge badge-purple" style="font-family:var(--font-display); font-weight:800">
                ${i.confidence}% Confidence
              </span>
            </div>
          </div>

          <div class="insight-section-box">
            <div class="insight-section-title">🔍 Data Evidence &amp; Root Cause</div>
            <div style="color:var(--text-secondary)">${i.evidence}</div>
          </div>

          <div class="insight-section-box" style="border-left: 3px solid var(--nova-orange);">
            <div class="insight-section-title">📉 Financial &amp; Business Impact</div>
            <div style="color:var(--nova-orange); font-weight:600">${i.impact}</div>
          </div>

          <div class="insight-section-box" style="border-left: 3px solid var(--nova-green);">
            <div class="insight-section-title">💡 Recommended AI Intervention</div>
            <div style="color:var(--nova-green-light); font-weight:600">${i.action}</div>
          </div>

          <div style="display:flex; justify-content:flex-end; margin-top:14px;">
            <button class="btn-primary btn-sm" onclick="applyInsightAction('${i.id}')">
              🚀 Execute Action Now
            </button>
          </div>
        </div>
      `).join('');
    }

    function applyInsightAction(id) {
      const item = window.NOVACART_DATA.insights.find(i => i.id === id);
      if (item) {
        NOVA_UI.showToast(`Action Executed: "${item.action}"`, 'success');
      }
    }

    function generateNewInsight() {
      NOVA_UI.showToast('AI Pattern Engine scanned 500+ orders: All critical insights up to date!', 'info');
    }
  </script>
</body>
</html>
